<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	%sveltekit.head%
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<!-- Inline script to prevent theme flash (FOUC) -->
	<script>
		(function() {
			const key = 'll:dark-mode';
			const stored = localStorage.getItem(key);
			const isDark = stored !== null ? stored === '1' : true;

			document.documentElement.classList.toggle('dark', isDark);
		})();
	</script>
</head>
<body data-sveltekit-preload-data="hover">
<div style="display: flex; flex-direction: column">%sveltekit.body%</div>
</body>
<style>
  body {
    margin: 0;
    padding: 0;
  }

  body * {
    font-family: 'Work Sans', SansSerif, sans-serif;
  }


  html, body {
    background: var(--color-white-450);
	}


  html.dark, body.dark {
    background: var(--color-dark-600);
  }
</style>
</html>
